version: '3.8'

services:
  backend:
    image: song-service-backend:latest
    build: .
    ports:
      - "5002:5001"
    environment:
      - SERVICE_ID=service1
      - PEERS=service2,service3
    depends_on:
      - mongo
    networks:
      - backend1_network

  mongo:
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    networks:
      - backend1_network

networks:
  backend1_network: 

volumes:
  mongo-data:
